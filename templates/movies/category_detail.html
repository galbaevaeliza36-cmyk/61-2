{% extends 'movies/base.html' %}

{% block title %}Категория: {{ category.name }}{% endblock %}

{% block content %}
<h1>Категория: {{ category.name }}</h1>
<h2>Фильмы в категории:</h2>
<ul>
    {% for movie in movies %}
        <li><a href="{% url 'movie_detail' movie.slug %}">{{ movie.title }}</a></li>
    {% endfor %}
</ul>
{% endblock %}
